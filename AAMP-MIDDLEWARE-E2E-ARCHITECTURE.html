<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAMP + Middleware E2E Architecture</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            color: #24292f;
            background: #fff;
        }
        h1 { border-bottom: 2px solid #d0d7de; padding-bottom: 0.3em; color: #1f2328; }
        h2 { border-bottom: 1px solid #d0d7de; padding-bottom: 0.3em; margin-top: 2em; color: #1f2328; }
        h3 { color: #1f2328; }
        code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        pre { background: #f6f8fa; padding: 16px; border-radius: 8px; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        th, td { border: 1px solid #d0d7de; padding: 8px 12px; text-align: left; }
        th { background: #f6f8fa; font-weight: 600; }
        tr:nth-child(even) { background: #f6f8fa; }
        blockquote { border-left: 4px solid #d0d7de; margin: 0; padding: 0.5em 1em; color: #57606a; }
        .mermaid { text-align: center; margin: 1.5em 0; }
        a { color: #0969da; text-decoration: none; }
        a:hover { text-decoration: underline; }
        hr { border: none; border-top: 1px solid #d0d7de; margin: 2em 0; }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            securityLevel: 'loose',
            flowchart: { useMaxWidth: true, htmlLabels: true },
            sequence: { useMaxWidth: true }
        });

        fetch('AAMP-MIDDLEWARE-E2E-ARCHITECTURE.md')
            .then(r => r.text())
            .then(md => {
                const renderer = new marked.Renderer();
                renderer.code = function(code, language) {
                    if (language === 'mermaid') {
                        return '<div class="mermaid">' + code + '</div>';
                    }
                    return '<pre><code class="language-' + (language || '') + '">' + 
                           code.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
                };
                marked.setOptions({ renderer: renderer, gfm: true, breaks: false });
                document.getElementById('content').innerHTML = marked.parse(md);
                mermaid.run();
            })
            .catch(err => {
                document.getElementById('content').innerHTML = '<h1>Error loading markdown</h1><p>' + err.message + '</p><p>Make sure you open this HTML file from the same directory as the .md file, or use a local server.</p>';
            });
    </script>
</body>
</html>
