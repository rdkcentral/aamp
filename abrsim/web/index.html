<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AAMP ABR Simulator</title>
	<link rel="stylesheet" href="style.css">
	<script src="chart.min.js"></script>
</head>
<body>
	<div class="container">
		<header>
			<h1>🎬 AAMP ABR Simulator</h1>
			<p>Test adaptive bitrate algorithms in faster-than-real-time</p>
		</header>

		<div class="content">
			<div class="left-panel">
				<section class="card">
					<h2>Simulation Parameters</h2>
					
					<!-- Mode Selector -->
					<div class="form-group">
						<label>Mode:</label>
						<div style="display: flex; gap: 15px;">
							<label>
								<input type="radio" name="simMode" value="persona" checked>
								Single Network Persona
							</label>
							<label>
								<input type="radio" name="simMode" value="scenario">
								Network Scenario
							</label>
						</div>
					</div>
					
					<!-- Persona Selector -->
					<div id="personaSelection" class="form-group">
						<label for="persona">Network Persona:</label>
						<select id="persona">
							<option value="sample_network.json">Loading...</option>
						</select>
					</div>
					
					<!-- Scenario Selector -->
					<div id="scenarioSelection" class="form-group" style="display: none;">
						<label for="scenario">Network Scenario:</label>
						<select id="scenario">
							<option value="">Loading...</option>
						</select>
						<div id="scenarioInfo" style="margin-top: 8px; font-size: 0.9em; color: #666;">
							<span id="scenarioDescription"></span>
						</div>
					</div>
					
					<div class="form-group">
						<label for="duration">Duration (seconds):</label>
						<input type="number" id="duration" value="3600" min="60" max="86400">
					</div>
				<!-- Profile Selection -->
				<div class="form-group">
					<label>ABR Profiles:</label>
					<div id="profilesContainer" style="margin-top: 8px;">
						<div style="color: #666; font-size: 0.9em;">Loading profiles...</div>
					</div>
				</div>
					<div class="form-group">
						<label for="isLive">
							<input type="checkbox" id="isLive" checked>
							Live Streaming
						</label>
						Live Playback
					</label>
				<div id="liveSettings" class="form-group" style="margin-left: 20px;">
					<label for="targetLatency">Target Latency (seconds):</label>
					<input type="number" id="targetLatency" value="6" min="2" max="30" step="0.5">
				</div>

				<div id="vodSettings" class="form-group" style="display: none;">
						<label for="maxBuffer">Max Buffer (seconds):</label>
						<input type="number" id="maxBuffer" value="20" min="5" max="60">
					</div>

					<div class="form-group">
						<label for="seed">Random Seed (0 = random):</label>
						<input type="number" id="seed" value="0" min="0">
					</div>

				<div class="form-group">
					<label>Segment Duration:</label>
					<span style="font-weight: bold;">2.0 seconds</span>
				</div>

			<button id="runBtn" class="btn-primary">Run Simulation</button>
			
			<!-- Status message area -->
			<div id="status" class="status" style="display: none;"></div>
		</section>

		<section class="card">
					<h2>Results Summary</h2>
					<div id="summary" class="summary">
						<p class="placeholder">Run a simulation to see results</p>
					</div>
				</section>
			</div>

			<div class="right-panel">
				<section class="card">
					<h2>Buffer Level Over Time</h2>
					<canvas id="bufferChart"></canvas>
				</section>

				<section class="card">
					<h2>Bandwidth Over Time</h2>
					<canvas id="bandwidthChart"></canvas>
				</section>

				<section class="card">
					<h2>Segment Download Timeline</h2>
					<canvas id="timelineChart" height="400"></canvas>
				</section>
			</div>
		</div>
	</div>

	<script src="app.js"></script>
</body>
</html>
