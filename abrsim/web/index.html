<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AAMP ABR Simulator</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
	<div class="container">
		<header>
			<h1>🎬 AAMP ABR Simulator</h1>
			<p>Test adaptive bitrate algorithms in faster-than-real-time</p>
		</header>

		<div class="content">
			<div class="left-panel">
				<section class="card">
					<h2>Simulation Parameters</h2>
					
					<div class="form-group">
						<label for="persona">Network Persona:</label>
						<select id="persona">
							<option value="sample_network.json">Loading...</option>
						</select>
					</div>

					<div class="form-group">
						<label for="duration">Duration (seconds):</label>
						<input type="number" id="duration" value="3600" min="60" max="86400">
					</div>

					<div class="form-group">
						<label>
							<input type="checkbox" id="isLive">
							Live Streaming Mode
						</label>
					</div>

					<div id="liveSettings" class="form-group" style="display: none; margin-left: 20px;">
						<label for="targetLatency">Target Latency (seconds):</label>
						<input type="number" id="targetLatency" value="8" min="2" max="30" step="0.5">
					</div>

					<div id="vodSettings" class="form-group">
						<label for="maxBuffer">Max Buffer (seconds):</label>
						<input type="number" id="maxBuffer" value="20" min="5" max="60">
					</div>

					<div class="form-group">
						<label for="seed">Random Seed (0 = random):</label>
						<input type="number" id="seed" value="0" min="0">
					</div>

					<button id="runBtn" class="btn btn-primary">Run Simulation</button>
					<div id="status" class="status"></div>
				</section>

				<section class="card">
					<h2>Results Summary</h2>
					<div id="summary" class="summary">
						<p class="placeholder">Run a simulation to see results</p>
					</div>
				</section>
			</div>

			<div class="right-panel">
				<section class="card">
					<h2>Bitrate Over Time</h2>
					<canvas id="bitrateChart"></canvas>
				</section>

				<section class="card">
					<h2>Buffer Level Over Time</h2>
					<canvas id="bufferChart"></canvas>
				</section>

				<section class="card">
					<h2>Bandwidth Over Time</h2>
					<canvas id="bandwidthChart"></canvas>
				</section>
			</div>
		</div>
	</div>

	<script src="app.js"></script>
</body>
</html>
