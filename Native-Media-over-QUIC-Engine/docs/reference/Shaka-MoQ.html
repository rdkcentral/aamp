<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Shaka MoQ Player</title>

  <!--
    Opened by tools/test_runner with ?report=1: mirror console output and playback
    events to the runner's local server. Installed before Shaka so its logging is
    captured too. Without ?report the page behaves as before.
  -->
  <script>
    (function () {
      if (!new URLSearchParams(window.location.search).get('report')) return;
      const start = performance.now();
      const send = (event) => {
        event.t_ms = Math.round(performance.now() - start);
        fetch('/report', { method: 'POST', body: JSON.stringify(event), keepalive: true }).catch(() => {});
      };
      const describe = (value) => {
        if (value instanceof Error) return `${value.name}: ${value.message}`;
        if (value && typeof value === 'object') {
          try { return JSON.stringify(value); } catch (e) { return String(value); }
        }
        return String(value);
      };
      for (const level of ['debug', 'log', 'info', 'warn', 'error']) {
        const original = console[level].bind(console);
        console[level] = (...args) => {
          original(...args);
          send({ type: 'log', level, text: args.map(describe).join(' ') });
        };
      }
      window.addEventListener('error', (e) => send({ type: 'log', level: 'error', text: e.message }));
      window.addEventListener('unhandledrejection', (e) => send({ type: 'log', level: 'error', text: describe(e.reason) }));
      window.nmqeReport = send;
    })();
  </script>

  <!-- Shaka experimental build required for MoQ/MSF -->
  <script src="https://shaka-project.github.io/shaka-player/dist/shaka-player.experimental.debug.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: black;
    }

  </style>

</head>


<body>

  <video
    id="video"
    autoplay
    muted
    controls
    playsinline>
  </video>


  <script>

    'use strict';


    /*
     * The relay is not committed: open this page as
     *   Shaka-MoQ.html?relay=https://<relay-host>:4443/
     * Optional: &ns=<namespace> (default mediakind-test), &version=<draft-NN> (default draft-22)
     */
    const PARAMS = new URLSearchParams(window.location.search);
    const RELAY_URL = PARAMS.get('relay') || '';
    const NAMESPACE = PARAMS.get('ns') || 'mediakind-test';
    const VERSION = PARAMS.get('version') || 'draft-22';


    async function initPlayer() {

      console.log('Initializing Shaka MoQ player...');

      if (!RELAY_URL) {
        console.error('Missing ?relay=<relay URL> query parameter.');
        return;
      }


      /*
       * Install Shaka polyfills
       */

      shaka.polyfill.installAll();


      /*
       * Verify browser support
       */

      if (!shaka.Player.isBrowserSupported()) {

        console.error(
          'Browser is not supported by Shaka Player.'
        );

        return;
      }


      const video =
        document.getElementById('video');

      if (window.nmqeReport) {
        for (const name of ['loadedmetadata', 'playing', 'waiting', 'stalled', 'error', 'ended']) {
          video.addEventListener(name, () => window.nmqeReport({
            type: 'video', name, current_time: video.currentTime
          }));
        }
        setInterval(() => {
          const quality = video.getVideoPlaybackQuality();
          const buffered = video.buffered;
          window.nmqeReport({
            type: 'status',
            current_time: video.currentTime,
            buffered_end: buffered.length ? buffered.end(buffered.length - 1) : 0,
            paused: video.paused,
            ready_state: video.readyState,
            total_frames: quality.totalVideoFrames,
            dropped_frames: quality.droppedVideoFrames
          });
        }, 1000);
      }


      /*
       * Create Shaka player
       */

      const player =
        new shaka.Player();


      await player.attach(video);


      /*
       * Display useful Shaka errors
       */

      player.addEventListener(
        'error',
        (event) => {

          console.error(
            'Shaka error:',
            event.detail
          );

        }
      );


      /*
       * Configure MoQ/MSF.
       *
       * Explicitly specifying the namespace prevents Shaka
       * from waiting for namespace discovery and eventually
       * reporting MSF_CATALOG_TIMEOUT.
       */

      player.configure({

        manifest: {

          msf: {

            namespaces: [
              NAMESPACE
            ],

            version: VERSION

          }

        }

      });


      try {

        console.log(
          'Loading MoQ stream:',
          RELAY_URL
        );


        /*
         * application/msf tells Shaka to use its
         * Media over QUIC/MSF manifest parser.
         */

        await player.load(
          RELAY_URL,
          null,
          'application/msf'
        );


        console.log(
          'MoQ stream loaded.'
        );


        /*
         * Start playback automatically.
         *
         * Chrome normally allows autoplay when the
         * video is muted.
         */

        await video.play();


        console.log(
          'Playback started.'
        );


      } catch (error) {

        console.error(
          'Failed to load/play MoQ stream:',
          error
        );

      }

    }


    /*
     * Start automatically when the page loads.
     */

    window.addEventListener(
      'load',
      initPlayer
    );

  </script>

</body>

</html>
