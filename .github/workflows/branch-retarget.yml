name: Auto Retarget Pull Requests

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  retarget:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    steps:
      - name: Debug event info
        run: |
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head branch: ${{ github.event.pull_request.head.ref }}"
          echo "Event action: ${{ github.event.action }}"

      - name: Auto-retarget feature/* PRs
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const baseBranch = context.payload.pull_request.base.ref; // target
            const headBranch = context.payload.pull_request.head.ref; // source

            if (headBranch.startsWith("feature/") && baseBranch === "develop") {
              console.log(`Changing PR #${prNumber} base from ${baseBranch} to dev_sprint_25_2...`);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                base: "dev_sprint_25_2"
              });
              console.log(`PR retargeted to dev_sprint_25_2, since head branch is a feature branch and target is develop.`);
            } else {
              console.log(`No change needed (head=${headBranch}, base=${baseBranch})`);
            }