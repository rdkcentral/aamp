name: Trigger L2 Tests


# Fires on every push to a PR that targets any dev_sprint_* branch.
on:
  pull_request:
    branches:
      # - 'dev_sprint_*'
      - 'feature/VPAAMP-312-test'
    types: [opened, synchronize, reopened]

# Cancel any in-flight dispatch for the same PR when a new commit is pushed.
# The matching concurrency group in the private repo will also cancel its run.
concurrency:
  group: l2-tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# GITHUB_TOKEN only needs to write commit statuses; nothing else.
permissions:
  statuses: write

jobs:
  trigger:
    name: Dispatch to private runner
    runs-on: ubuntu-latest

    # -----------------------------------------------------------------------
    # SECURITY GUARD: Only fire for PRs that originate from within this repo.
    # Fork PRs are blocked here
    # -----------------------------------------------------------------------
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # ------------------------------------------------------------------
      # Fetch all files changed in this PR and check whether every one of
      # them falls into a "skip" category:
      #   • documentation files  (*.md, *.rst, docs/**)
      #   • L1 unit-test tree    (test/utests/**)
      # If so, mark the commit status as success and skip the dispatch so
      # the private runner is not needlessly consumed.
      # ------------------------------------------------------------------
      - name: Check changed files
        id: check_changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate \
            "/repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename')

          should_skip=true
          while IFS= read -r file; do
            if [[ "$file" =~ ^test/utests/ ]] || \
               [[ "$file" =~ \.md$        ]] || \
               [[ "$file" =~ \.rst$       ]] || \
               [[ "$file" =~ ^docs/       ]]; then
              : # matches a skip pattern — keep checking
            else
              should_skip=false
              break
            fi
          done <<< "$files"

          echo "should_skip=${should_skip}" >> "$GITHUB_OUTPUT"

      # If every changed file matched a skip pattern, close out the status
      # immediately so the PR check turns green with an explanation.
      - name: Set commit status to skipped
        if: steps.check_changes.outputs.should_skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/statuses/${SHA}" \
            -f state=success \
            -f context="l2-tests/private" \
            -f description="L2 tests skipped — only docs or L1 unit-test files changed"

      # Mark the commit as "pending" immediately so the PR shows a check that
      # developers can watch. Uses the built-in GITHUB_TOKEN — no extra secret.
      - name: Set commit status to pending
        if: steps.check_changes.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/statuses/${SHA}" \
            -f state=pending \
            -f context="l2-tests/private" \
            -f description="L2 tests queued" \
            -f target_url="${RUN_URL}"

      # Build the JSON payload using jq so that PR metadata is passed safely
      # through environment variables rather than inline shell substitution.
      # L2_TEST_REPO secret holds the private test repo name so it never
      # appears in plain text in this public repository.
      - name: Dispatch L2 tests
        if: steps.check_changes.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.INT_TEST_DISPATCH_TOKEN }}
          TEST_REPO: ${{ secrets.L2_TEST_REPO }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUBLIC_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha    "$HEAD_SHA" \
            --arg head_ref    "$HEAD_REF" \
            --arg base_ref    "$BASE_REF" \
            --arg public_repo "$PUBLIC_REPO" \
            '{
              event_type: "run-l2-tests",
              client_payload: {
                pr_number:   $pr_number,
                head_sha:    $head_sha,
                head_ref:    $head_ref,
                base_ref:    $base_ref,
                public_repo: $public_repo
              }
            }')

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${TEST_REPO}/dispatches" \
            --input - <<< "$payload"
